name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  # 阿里云 ACR 地址（个人版/企业版不同，替换成你的）
  REGISTRY: registry.cn-shenzhen.aliyuncs.com
  NAMESPACE: zhenzi0322
  IMAGE_NAME: torch-comfyui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            cuda_suffix: cu13.0
          - dockerfile: Dockerfile.cuda12.8
            cuda_suffix: cu12.8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Extract tag name
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "DATE=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          outputs: type=image,oci-mediatypes=false
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.TAG }}-${{ matrix.cuda_suffix }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.cuda_suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
